name: Update Flaky Test Issue
run-name: ${{ github.event.workflow_run.display_title }}
on:
   workflow_run:
     workflows: [Test]
     types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
   issueForFlakyTest:
      if: github.event.workflow_run.conclusion == 'success'
      name: Flaky Test Issue
      runs-on: ubuntu-latest
      steps:

      # Only do the flaky processing on full builds
      - name: Download build type
        id: download-build-type
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: build-type
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read build type
        id: build-type
        run: |
          if [ -f build-type.txt ]; then
            BUILD_TYPE=$(cat build-type.txt)
          else
            BUILD_TYPE="full"
            echo "build-type artifact not found (older branch?), defaulting to full build"
          fi
          echo "build-type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "Build type: $BUILD_TYPE"

      - name: Checkout
        if: steps.build-type.outputs.build-type == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install xmlstarlet tool
        if: steps.build-type.outputs.build-type == 'full'
        # xmlstarlet is needed by .github/scripts/track_flaky_tests.sh
        shell: bash
        run: |
           sudo apt-get update
           sudo apt-get install -y xmlstarlet

      # Downloading flaky artifact containing
      # zip file with flaky test reports and file
      # containing PR target branch
      - name: Download a Build Artifact
        if: steps.build-type.outputs.build-type == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: download-artifact
        continue-on-error: true
        with:
           name: flaky-test-report
           github-token: ${{ github.token }}
           run-id: ${{ github.event.workflow_run.id }}

      - name: Create GitHub Issue
        if: steps.build-type.outputs.build-type == 'full' && steps.download-artifact.outcome == 'success'
        env:
          RUNNER_DEBUG: 1
          FLAKY_TEST_GLOB: "**/target/*-reports*/**/TEST-*FLAKY.xml"
          GH_JOB_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e  # Enable error propagation
          cat target-branch.txt
          TARGET_BRANCH=$(cat target-branch.txt) .github/scripts/track_flaky_tests.sh

      - name: Get event name
        if: steps.build-type.outputs.build-type == 'full' && steps.download-artifact.outcome == 'success'
        id: event_name
        uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1
        with:
          path: ./event-name.txt

      - name: Get PR number
        if: steps.build-type.outputs.build-type == 'full' && steps.download-artifact.outcome == 'success'
        id: pr-number
        uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1
        with:
          path: ./pr-number.txt

      - if: ${{ steps.download-artifact.outcome == 'success' && steps.event_name.outputs.content == 'pull_request' }}
        name: Comment PR
        uses: ./.github/actions/comment-pr-flaky-test
        with:
          pr-number: ${{ steps.pr-number.outputs.content }}

