name: Rolling Upgrade Test Module

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      # The identifier for this matrix entry (e.g., 'standard', 'special-config')
      name:
        required: true
        type: string
      # The version the upgrade starts from: either a literal version or image tag
      # (e.g., '16.0.1'), or the sentinel 'previous' for the newest release below the
      # version being built (e.g., 16.0.6 for a 16.0.7-SNAPSHOT build)
      from:
        required: true
        type: string
      # The extra arguments to pass to the test (e.g., '-DcustomProperty=true')
      maven-args:
        required: false
        type: string
        default: ''
      # Context inputs
      run-id:
        required: true
        type: string
      source-head-sha:
        required: true
        type: string
    secrets:
      GH_APP_ISPN_ID:
        required: true
      GH_APP_ISPN_KEY:
        required: true

jobs:
  test:
    name: Rolling Upgrades (${{ inputs.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Extract Maven Artifacts
        uses: ./.github/actions/extract-maven-artifacts
        with:
          run-id: ${{ inputs.run-id }}

      - name: Download Infinispan Server
        id: dis
        uses: ./.github/actions/download-infinispan
        with:
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      # The 'previous' sentinel resolves to the newest release below the version being
      # built, by counting the micro down from the build version until a published tag
      # is found (16.0.7-SNAPSHOT -> 16.0.6). Deriving it from the build keeps the FROM
      # side strictly older than the TO side, which the floating 'major.minor' and
      # 'latest' tags cannot guarantee: workflow_run always runs the default branch copy
      # of this workflow, so a hardcoded tag downgrades every maintenance branch.
      - name: Resolve Rolling Upgrade From Version
        id: from
        env:
          REQUESTED_FROM: ${{ inputs.from }}
          SERVER_VERSION: ${{ steps.dis.outputs.server-version }}
        run: |
          if [ "$REQUESTED_FROM" != "previous" ]; then
            FROM="$REQUESTED_FROM"
          else
            BASE="${SERVER_VERSION%%-*}"  # 16.0.7-SNAPSHOT -> 16.0.7
            LINE="${BASE%.*}"             # 16.0.7 -> 16.0
            MICRO="${BASE##*.}"           # 16.0.7 -> 7
            case "$MICRO" in ''|*[!0-9]*) MICRO=0 ;; esac
            FROM=''
            while [ "$MICRO" -gt 0 ]; do
              MICRO=$((MICRO - 1))
              if docker manifest inspect "quay.io/infinispan/server:$LINE.$MICRO" > /dev/null 2>&1; then
                FROM="$LINE.$MICRO"
                break
              fi
            done
            if [ -z "$FROM" ]; then
              # Nothing released on this line yet (a X.Y.0-SNAPSHOT development branch),
              # so start from the newest release of the previous line
              FROM='latest'
            fi
          fi
          echo "Rolling upgrade from version: $FROM"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"

      - name: Extract Infinispan Server
        working-directory: /tmp
        run: unzip -q "${GITHUB_WORKSPACE}/infinispan-server-${{ steps.dis.outputs.server-version }}.zip"

      - name: Extract Infinispan Source
        run: |
          mkdir test_dir && cd test_dir
          unzip -q "${GITHUB_WORKSPACE}/infinispan-${{ steps.dis.outputs.server-version }}-src.zip"
          mv infinispan-${{ steps.dis.outputs.server-version }}-src infinispan

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_ISPN_ID }}
          private-key: ${{ secrets.GH_APP_ISPN_KEY }}

      # Create a unique Check Run for this specific matrix entry
      - name: Create Check Run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        id: create_check
        run: |
          CHECK_RUN=$(gh api repos/${{ github.repository }}/check-runs \
            -H "Accept: application/vnd.github+json" \
            -f name="Test Report Rolling Upgrades (${{ inputs.name }})" \
            -f head_sha="${{ inputs.source-head-sha }}" \
            -f status="in_progress" \
            -f "output[summary]=Result from workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "output[title]=Waiting for report result..." \
            --method POST \
            --jq '.id')
          echo "id=$CHECK_RUN" >> "$GITHUB_OUTPUT"

      - name: Run Rolling Upgrade Tests
        working-directory: test_dir/infinispan
        run: |
          ./mvnw verify -B -e -pl server/rollingupgradetests \
            -Dmaven.test.failure.ignore=true \
            -Dansi.strip=true \
            -DskipRollingUpgradeTests=false \
            -Dorg.infinispan.test.server.dir=/tmp/infinispan-server-${{ steps.dis.outputs.server-version }} \
            -Dorg.infinispan.test.server.rolling.upgrade.from=${{ steps.from.outputs.from }} \
            -Pcoverage ${{ inputs.maven-args }}

      # Update Check Run Status
      - name: Update Check Run (Failure)
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/${{ github.repository }}/check-runs/${{ steps.create_check.outputs.id }} \
            -H "Accept: application/vnd.github+json" \
            -f status="completed" \
            -f conclusion="failure" \
            -f "output[title]=Run Failed" \
            -f "output[summary]=Tests failed. See logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --method PATCH

      - name: Archive commit sha PR
        if: >
          (success() || failure())
        run: |
          echo -n ${{ inputs.source-head-sha }} > github-sha.txt

      # Upload Artifacts with a UNIQUE name based on the input name
      # This allows the main workflow to distinguish between matrix runs
      - name: Upload jacoco exec files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-files-rolling-upgrades-${{ inputs.name }}
          path: |
            test_dir/infinispan/server/rollingupgradetests/target/*.exec

      - name: Upload surefire test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: surefire-test-report-rolling-upgrades-${{ inputs.name }}
          path: |
            test_dir/infinispan/**/target/*-reports*/**/TEST-*.xml
            !test_dir/infinispan/**/target/*-reports*/**/TEST-*FLAKY.xml
            test_dir/infinispan/**/*.dump*
            test_dir/infinispan/**/hs_err_*
            github-sha.txt

      - name: Upload log files
        if: (success() || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: log-files-rolling-upgrades-${{ inputs.name }}
          compression-level: 9
          path: |
            test_dir/infinispan/**/*.log
            !**/*[:"<>\*\?]*/**/*.log
            !**/*[:"<>\*\?]*.log
