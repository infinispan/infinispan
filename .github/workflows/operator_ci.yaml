name: Operator CI

on:
  push:
    branches:
      - main
      - '*.0.x'
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'CODEOWNERS'
      - 'documentation/**'
  pull_request:
    branches:
      - main
      - '*.0.x'
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'CODEOWNERS'
      - 'documentation/**'

permissions:
  contents: read

concurrency:
  # Cancel jobs same head_branch same repo, works
  # both for pull_request and push
  group: >
      ${{ github.workflow }}-${{ github.repository }}-
      ${{ github.event.pull_request.head.ref || github.event.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.infinispan.outputs.image }}
      version: ${{ steps.infinispan.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Image
        id: infinispan
        run: |
          SERVER_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          OPERAND_VERSION=$(echo "${SERVER_VERSION}" | cut -d '-' -f 1)
          IMAGE="localhost:5001/server:${SERVER_VERSION}"

          ./mvnw install -DskipTests -am -pl server/runtime,server/image -Pimage -Dimage.name="${IMAGE}"
          docker save "${IMAGE}" > /tmp/operand-image.tar

          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "version=${OPERAND_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operand-image
          path: /tmp/operand-image.tar

  tests:
    needs: image
    uses: infinispan/infinispan-operator/.github/workflows/ci.yml@d742f579ffcff8348b95c5f3f270865d174359c0 # main
    with:
      operand: ${{ needs.image.outputs.image }}
      operandArtifact: operand-image
      operandVersion: ${{ needs.image.outputs.version }}
      ref: main
      repository: infinispan/infinispan-operator
