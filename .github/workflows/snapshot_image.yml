name: Snapshot Images

on:
  workflow_call:
    inputs:
      name:
        description: 'The name of the image'
        required: true
        type: string
      runId:
        description: 'A workflow runId'
        required: true
        type: string
      tag:
        description: 'A tag to add to the snapshot image'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      name:
        description: 'The name of the image'
        default: 'server'
        type: string
      runId:
        description: 'A workflow runId'
        required: true
        type: string
      tag:
        description: 'A tag to add to the snapshot image'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: '${{ inputs.runId }}'
          name: infinispan-dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract artifact
        id: extract_artifact
        run: |
          unzip -q infinispan-*-src.zip
          SRCROOT=$(find . -maxdepth 1 -type d -name '*src')
          echo "srcroot=$SRCROOT" >> $GITHUB_OUTPUT
          mv infinispan-server-*.zip "$SRCROOT"/server/image/infinispan-server.zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with:
          build-args: |
            BRAND_VERSION=${{ inputs.runId }}
            BRAND_NAME=Infinispan
            JDK_DIST=src/main/docker/adoptium
            SERVER_DIST=infinispan-server.zip
          containerfiles: ./${{ steps.extract_artifact.outputs.srcroot }}/server/image/src/main/docker/Dockerfile
          context: ./${{ steps.extract_artifact.outputs.srcroot }}/server/image
          image: ${{ inputs.name }}
          platforms: linux/amd64, linux/arm64
          tags: ${{ inputs.tag }}

      - name: Log in to Quay.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          username: ${{ secrets.QUAY_USERNAME_TEST }}
          password: ${{ secrets.QUAY_TOKEN_TEST }}
          registry: quay.io

      - name: Push to Quay.io
        id: push-to-quay
        run: |
          podman manifest push ${{ inputs.name }}:${{ inputs.tag }} quay.io/infinispan-test/server:${{ inputs.tag }} --all --tls-verify=true --digestfile /tmp/digest
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      - name: Print Quay.io image url
        run: echo "Image pushed to quay.io/infinispan-test/server:${{ inputs.tag }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.3'

      - name: Prepare registry credentials for SBOM attestation
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          cp "$REGISTRY_AUTH_FILE" "$RUNNER_TEMP/docker-config/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: quay.io/infinispan-test/server@${{ steps.push-to-quay.outputs.digest }}
          format: spdx-json
          output-file: ./sbom.spdx.json
          syft-version: 'v1.52.0'
          upload-artifact: false
          upload-release-assets: false

      - name: Verify the OpenJDK package in the SBOM
        run: |
          set -euo pipefail
          # The SBOM must contain the OpenJDK package, otherwise it cannot be attributed by container scanners
          jq -e '[(.packages // [])[] | select((.name // "") | endswith("-openjdk"))] | length > 0' ./sbom.spdx.json

      - name: Remove the published tag if the SBOM check fails
        if: failure()
        run: |
          set -euo pipefail
          QTOKEN="${{ secrets.QUAY_TOKEN_TEST }}"
          QREPO_ID=$(curl -fsSL -H "Authorization: Bearer $QTOKEN" "https://quay.io/api/v1/repo/by_path/quay.io/infinispan-test/server" | jq -r '.id')
          # Delete the tag only if it was published by this run
          if [ "$(curl -fsS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $QTOKEN" "https://quay.io/api/v1/repo/${QREPO_ID}/tags/${{ inputs.tag }}")" = "200" ]; then
            curl -fsSL -X DELETE -H "Authorization: Bearer $QTOKEN" "https://quay.io/api/v1/repo/${QREPO_ID}/tag/${{ inputs.tag }}"
          fi

      - name: Create SBOM attestation
        run: |
          set -euo pipefail
          cosign attest --yes --predicate ./sbom.spdx.json --type spdxjson "quay.io/infinispan-test/server@${{ steps.push-to-quay.outputs.digest }}"
