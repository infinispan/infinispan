name: Snapshot Images

on:
  workflow_call:
    inputs:
      name:
        description: 'The name of the image'
        required: true
        type: string
      runId:
        description: 'A workflow runId'
        required: true
        type: string
      tag:
        description: 'A tag to add to the snapshot image'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      name:
        description: 'The name of the image'
        default: 'server'
        type: string
      runId:
        description: 'A workflow runId'
        required: true
        type: string
      tag:
        description: 'A tag to add to the snapshot image'
        required: true
        type: string

# Publishing a snapshot tag must not run concurrently for the same tag
concurrency:
  group: snapshot-images-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Pass user-controlled inputs via environment variables so that they are never
      # interpolated into, and evaluated by, the shell
      IMAGE_NAME: ${{ inputs.name }}
      IMAGE_TAG: ${{ inputs.tag }}

    steps:
      - name: Validate the image tag
        run: |
          set -euo pipefail
          # The tag derives from a branch name, so it must conform to registry tag
          # syntax before it is used in shell commands and registry API requests
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "Invalid image tag: $IMAGE_TAG" >&2
            exit 1
          fi

      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: '${{ inputs.runId }}'
          name: infinispan-dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract artifact
        id: extract_artifact
        run: |
          unzip -q infinispan-*-src.zip
          SRCROOT=$(find . -maxdepth 1 -type d -name '*src')
          echo "srcroot=$SRCROOT" >> $GITHUB_OUTPUT
          mv infinispan-server-*.zip "$SRCROOT"/server/image/infinispan-server.zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with:
          build-args: |
            BRAND_VERSION=${{ inputs.runId }}
            BRAND_NAME=Infinispan
            JDK_DIST=src/main/docker/adoptium
            SERVER_DIST=infinispan-server.zip
          containerfiles: ./${{ steps.extract_artifact.outputs.srcroot }}/server/image/src/main/docker/Dockerfile
          context: ./${{ steps.extract_artifact.outputs.srcroot }}/server/image
          image: ${{ inputs.name }}
          platforms: linux/amd64, linux/arm64
          tags: ${{ inputs.tag }}

      - name: Log in to Quay.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          username: ${{ secrets.QUAY_USERNAME_TEST }}
          password: ${{ secrets.QUAY_TOKEN_TEST }}
          registry: quay.io

      - name: Push to Quay.io
        id: push-to-quay
        run: |
          set -euo pipefail
          podman manifest push "$IMAGE_NAME:$IMAGE_TAG" "quay.io/infinispan-test/server:$IMAGE_TAG" --all --tls-verify=true --digestfile /tmp/digest
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      - name: Print Quay.io image url
        run: echo "Image pushed to quay.io/infinispan-test/server:$IMAGE_TAG"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.3'

      - name: Prepare registry credentials for SBOM attestation
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          cp "$REGISTRY_AUTH_FILE" "$RUNNER_TEMP/docker-config/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Generate SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: quay.io/infinispan-test/server@${{ steps.push-to-quay.outputs.digest }}
          format: spdx-json
          output-file: ./sbom.spdx.json
          syft-version: 'v1.52.0'
          upload-artifact: false
          upload-release-assets: false

      - name: Verify the OpenJDK package in the SBOM
        run: |
          set -euo pipefail
          # The SBOM must contain the OpenJDK package, otherwise it cannot be attributed by container scanners
          jq -e '[(.packages // [])[] | select((.name // "") | endswith("-openjdk"))] | length > 0' ./sbom.spdx.json

      - name: Create SBOM attestation
        run: |
          set -euo pipefail
          cosign attest --yes --predicate ./sbom.spdx.json --type spdxjson "quay.io/infinispan-test/server@${{ steps.push-to-quay.outputs.digest }}"
