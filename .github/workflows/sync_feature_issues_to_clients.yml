name: 'Sync feature issues to client repositories'
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: sync-feature-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync-to-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_ISPN_ID }}
          private-key: ${{ secrets.GH_APP_ISPN_KEY }}

      - name: Clone the issue to the client repositories if it is a Hot Rod feature request
        run: .github/scripts/sync-feature-issue-to-clients.sh "${{ github.event.issue.number }}" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
