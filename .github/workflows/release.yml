name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The Infinispan branch to checkout when cutting the release."
        required: true
        default: "main"
      version:
        description: "Release version (blank = derive from pom.xml, only if micro > 0)"
        required: false
      nextVersion:
        description: "Next version (blank = next micro SNAPSHOT)"
        required: false
      type:
         type: choice
         description: The type of release
         required: true
         default: "default"
         options:
            - default
            - latest
            - prerelease

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.resolve-versions.outputs.RELEASE_VERSION }}
      nextVersion: ${{ steps.resolve-versions.outputs.NEXT_VERSION }}

    steps:
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'zulu'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.email "infinispan@infinispan.org"
          git config user.name "Infinispan"

      - name: Resolve versions
        id: resolve-versions
        env:
          # Dispatch inputs are indirected through the environment so they reach the script
          # as data rather than shell syntax; the regex below rejects anything that is not
          # a release version.
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NEXT_VERSION: ${{ inputs.nextVersion }}
        run: |
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "POM version: $POM_VERSION"

          RELEASE_VERSION="$INPUT_VERSION"
          if [ -n "$RELEASE_VERSION" ] && ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){2}(\.[A-Za-z][A-Za-z0-9]*)?(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Invalid release version: $RELEASE_VERSION"
            exit 1
          fi
          if [ -z "$RELEASE_VERSION" ]; then
            # Derive from pom.xml: strip -SNAPSHOT suffix
            if [[ "$POM_VERSION" != *-SNAPSHOT ]]; then
              echo "::error::POM version '$POM_VERSION' is not a SNAPSHOT version"
              exit 1
            fi
            RELEASE_VERSION="${POM_VERSION%-SNAPSHOT}"
            # Extract micro version and check it's non-zero
            MICRO=$(echo "$RELEASE_VERSION" | cut -d. -f3)
            if [ "$MICRO" = "0" ]; then
              echo "::error::Cannot derive release version from '$POM_VERSION' (micro is 0). Please specify 'Release version' explicitly."
              exit 1
            fi
          fi

          NEXT_VERSION="$INPUT_NEXT_VERSION"
          if [ -n "$NEXT_VERSION" ] && ! [[ "$NEXT_VERSION" =~ ^[0-9]+(\.[0-9]+){2}(\.[A-Za-z][A-Za-z0-9]*)?(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Invalid next version: $NEXT_VERSION"
            exit 1
          fi
          if [ -z "$NEXT_VERSION" ]; then
            # Bump micro: 16.1.2 -> 16.1.3-SNAPSHOT
            MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
            MICRO=$(echo "$RELEASE_VERSION" | cut -d. -f3)
            NEXT_MICRO=$((MICRO + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_MICRO}-SNAPSHOT"
          fi

          # Validate the resolved values regardless of their origin: a blank dispatch
          # version derives them from the checked-out POM, whose content is controlled
          # by the selected branch, and these values are interpolated into later shell
          # commands that run with the release credentials in their environment.
          for v in "$RELEASE_VERSION" "$NEXT_VERSION"; do
            if ! [[ "$v" =~ ^[0-9]+(\.[0-9]+){2}(\.[A-Za-z][A-Za-z0-9]*)?(-[A-Za-z0-9._-]+)?$ ]]; then
              echo "::error::Invalid resolved version: $v"
              exit 1
            fi
          done

          echo "Release version: $RELEASE_VERSION"
          echo "Next version: $NEXT_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update proto.lock files
        run: |
          mvn -B clean install -DskipTests -DcommitProtoLockChanges=true -Dcheckstyle.skip

      - name: Set release version
        run: |
          mvn -B versions:set -DprocessAllModules=true -DnewVersion=${{ steps.resolve-versions.outputs.RELEASE_VERSION }}
          mvn -B versions:set-property -Dproperty=version.infinispan -DnewVersion=${{ steps.resolve-versions.outputs.RELEASE_VERSION }}
          sed -i "s/^:ispn_version:.*\$/:ispn_version: ${{ steps.resolve-versions.outputs.RELEASE_VERSION }}/" documentation/src/main/asciidoc/topics/attributes/community-attributes.adoc
          git commit --no-verify -a -m "Releasing ${{ steps.resolve-versions.outputs.RELEASE_VERSION }}"

      - name: Publish to Central
        run: mvn -B -Drelease-mode=upstream -Pdistribution -Pcommunity-release -DskipTests -Dgpg.signer=bc clean deploy -Dinfinispan.brand.version=${{ steps.resolve-versions.outputs.RELEASE_VERSION }}
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.INFINISPAN_MAVEN_GPG_ARMORED }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.INFINISPAN_MAVEN_GPG_PASSPHRASE }}

      - name: Tag Release
        run: |
          git tag -a ${{ steps.resolve-versions.outputs.RELEASE_VERSION }} -m ${{ steps.resolve-versions.outputs.RELEASE_VERSION }}

      - name: Next Version
        run: |
          mvn -B versions:set -DprocessAllModules=true -DnewVersion=${{ steps.resolve-versions.outputs.NEXT_VERSION }}
          mvn -B versions:set-property -Dproperty=version.infinispan -DnewVersion=${{ steps.resolve-versions.outputs.NEXT_VERSION }}
          git commit --no-verify -a -m "Next version ${{ steps.resolve-versions.outputs.NEXT_VERSION }}"

      - name: Push changes
        env:
          # Indirected so a crafted branch input cannot inject shell commands
          BRANCH: ${{ inputs.branch }}
        run: |
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::Invalid branch name: $BRANCH"
            exit 1
          fi
          # The explicit refspec starts with refs/heads/, so git can never parse the
          # branch value as a push option (e.g. a branch named --force would otherwise
          # enable force-pushing the release tags instead of pushing that branch).
          git push --tags origin "refs/heads/$BRANCH:refs/heads/$BRANCH"

      - name: Create default release
        if: ${{ inputs.type == 'default' }}
        run: |
           gh release create ${{ steps.resolve-versions.outputs.RELEASE_VERSION }} --generate-notes --latest=false
        env:
           GITHUB_TOKEN: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}

      -  name: Create pre-release
         if: ${{ inputs.type == 'prerelease' }}
         run: |
            gh release create ${{ steps.resolve-versions.outputs.RELEASE_VERSION }} --generate-notes --latest=false --prerelease
         env:
            GITHUB_TOKEN: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}

      -  name: Create latest release
         if: ${{ inputs.type == 'latest' }}
         run: |
            gh release create ${{ steps.resolve-versions.outputs.RELEASE_VERSION }} --generate-notes --latest=true
         env:
            GITHUB_TOKEN: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}

      # The distribution is signed and attached by the sign-server-dist job. Signing is kept
      # out of this job because it checks out inputs.branch, which may predate the signing
      # action, and so that the signing credentials never run on its build code. The ZIP is
      # attached here, before the later failure-prone attestation steps, and also staged as
      # a version-named run artifact, so that a run that fails after staging can still be
      # resumed: the sign-server-dist job re-uploads the same bytes with --clobber to add
      # the signature, and the resume workflow recovers the ZIP from the staged artifact
      # when it is missing from the release.
      - name: Upload server distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infinispan-server-dist-${{ steps.resolve-versions.outputs.RELEASE_VERSION }}
          path: distribution/target/distribution/infinispan-server-${{ steps.resolve-versions.outputs.RELEASE_VERSION }}.zip
          if-no-files-found: error
          # Re-running the job after an artifact of this name was already uploaded
          # would otherwise fail on the duplicate name.
          overwrite: true

      - name: Attach server distribution to release
        run: |
          # --clobber so that re-running the release after this step already attached
          # the ZIP does not fail on the existing asset: the sign-server-dist job then
          # replaces the same bytes with the signed pair.
          gh release upload --clobber "$RELEASE" "distribution/target/distribution/infinispan-server-$RELEASE.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          RELEASE: ${{ steps.resolve-versions.outputs.RELEASE_VERSION }}

      - name: Check SBOM availability
        id: sbom-check
        run: |
          if [ -f distribution/target/bom.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach SBOM
        if: steps.sbom-check.outputs.exists == 'true'
        run: |
          # --clobber so a retry does not fail on the already-attached SBOM.
          gh release upload --clobber ${{ steps.resolve-versions.outputs.RELEASE_VERSION }} "distribution/target/bom.json#infinispan-sbom-${{ steps.resolve-versions.outputs.RELEASE_VERSION }}.cdx.json"
        env:
          GITHUB_TOKEN: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}

      - name: Attest server distribution provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: distribution/target/distribution/infinispan-server-${{ steps.resolve-versions.outputs.RELEASE_VERSION }}.zip

      - name: Attest SBOM
        if: steps.sbom-check.outputs.exists == 'true'
        uses: actions/attest-sbom@v4
        with:
          subject-path: distribution/target/distribution/infinispan-server-${{ steps.resolve-versions.outputs.RELEASE_VERSION }}.zip
          sbom-path: distribution/target/bom.json

  published:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: GOSCHEN/http-status-code@944938ed534b092b9f7e1e5c6b08c5d9bbc35162 # v1.1.0
        with:
          url: https://repo1.maven.org/maven2/org/infinispan/infinispan-distribution/${{ needs.release.outputs.version }}/infinispan-distribution-${{ needs.release.outputs.version }}.pom
          code: 200
          timeout: 10800000
          interval: 1200

  native-cli:
    needs: [published, release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-2022, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            asset_name: linux-x86_64
            gu_binary: gu
            native_extra_args: -Dnative.build.xmx=10g -Dquarkus.native.native-image-xmx=10g
          - os: macos-latest
            asset_name: osx-aarch_64
            gu_binary: gu
            native_extra_args: -Dnative.build.xmx=5500m -Dquarkus.native.native-image-xmx=5500m
          - os: macos-15-intel
            asset_name: osx-x86_64
            gu_binary: gu
            native_extra_args: -Dnative.build.xmx=5500m -Dquarkus.native.native-image-xmx=5500m
          - os: windows-2022
            asset_name: windows-x86_64
            gu_binary: gu.cmd
            native_extra_args: -Dnative.build.xmx=10g -Dquarkus.native.native-image-xmx=10g
          - os: ubuntu-24.04-arm
            asset_name: linux-aarch_64
            gu_binary: gu
            native_extra_args: -Dnative.build.xmx=10g -Dquarkus.native.native-image-xmx=10g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1
        with:
          version: '25.0'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Detect CLI module path
        id: detect-cli
        shell: bash
        run: |
          if [ -f graalvm/cli/pom.xml ]; then
            echo "module=graalvm/cli" >> $GITHUB_OUTPUT
          else
            echo "module=quarkus/cli" >> $GITHUB_OUTPUT
          fi

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Build native executable
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86_amd64
          mvnw.cmd package -Pdistribution -Pwindows -Pnative -am -pl ${{ steps.detect-cli.outputs.module }} ${{ matrix.native_extra_args }}
        shell: cmd

      - if: ${{ matrix.os != 'windows-2022' }}
        name: Build native executable
        run: ./mvnw package -Pdistribution -Pnative -am -pl ${{ steps.detect-cli.outputs.module }} ${{ matrix.native_extra_args }}

      # The built archive is passed to the sign-cli-assets job, which signs and attaches it.
      # Keeping the credentials out of this job means tag-controlled build code never executes
      # on a runner that holds the GPG key, passphrase or release token.
      - name: Upload CLI native executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infinispan-cli-${{ matrix.asset_name }}
          path: ${{ steps.detect-cli.outputs.module }}/target/infinispan-cli-${{ needs.release.outputs.version }}-${{ matrix.asset_name }}.zip
          if-no-files-found: error
          # Re-running the job after an artifact of this name was already uploaded
          # would otherwise fail on the duplicate name.
          overwrite: true

  # Signs and attaches the CLI native executables built by native-cli. This is a separate job
  # that does not check out the release tag, for two reasons:
  # - the signing credentials never run on a runner that executed tag-controlled build code;
  # - the signing action is always loaded from the workflow's own revision, so it is available
  #   even for tags that predate it.
  sign-cli-assets:
    needs: [native-cli, release]
    runs-on: ubuntu-latest
    concurrency:
      # Keyed on the resolved version so that it serializes with the sign-cli-assets job of
      # the resume workflow even when this release was dispatched without an explicit version.
      # GitHub keeps only one pending job per group, so a queued job displaces an older
      # pending one; that is acceptable here because the displacing job is not a matrix leg
      # but the same single upload for the same version, so no work is lost. Once actionlint
      # learns the concurrency "queue" property (github.blog/changelog/2026-05-07), setting
      # queue: max here removes the limitation.
      group: sign-cli-assets-${{ needs.release.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download CLI native executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: cli-assets
          pattern: infinispan-cli-*

      - name: Sign and attach CLI native executables
        uses: ./.github/actions/sign-release-assets
        with:
          release-tag: ${{ needs.release.outputs.version }}
          asset-paths: cli-assets/*/*.zip
          gpg-armored-key: ${{ secrets.INFINISPAN_MAVEN_GPG_ARMORED }}
          gpg-passphrase: ${{ secrets.INFINISPAN_MAVEN_GPG_PASSPHRASE }}
          token: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          clobber: "true"

  # Signs and attaches the server distribution built by the release job. Kept out of the
  # release job so that the signing action is loaded from the workflow's own revision
  # instead of the inputs.branch checkout, which may predate the action. Note that this
  # isolates release-asset signing only: the release job itself must sign the Maven
  # artifacts it deploys to Central, so it necessarily runs the Maven deploy with the GPG
  # key in its environment while building the inputs.branch code.
  sign-server-dist:
    needs: [release]
    runs-on: ubuntu-latest
    concurrency:
      # Keyed on the resolved version so that it serializes with the server-dist job of the
      # resume workflow even when this release was dispatched without an explicit version.
      # GitHub keeps only one pending job per group, so a queued job displaces an older
      # pending one; that is acceptable here because the displacing job is not a matrix leg
      # but the same single upload for the same version, so no work is lost. Once actionlint
      # learns the concurrency "queue" property (github.blog/changelog/2026-05-07), setting
      # queue: max here removes the limitation.
      group: sign-server-assets-${{ needs.release.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download server distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: infinispan-server-dist-${{ needs.release.outputs.version }}
          path: server-dist

      - name: Sign and attach server distribution
        uses: ./.github/actions/sign-release-assets
        with:
          release-tag: ${{ needs.release.outputs.version }}
          asset-paths: server-dist/*.zip
          gpg-armored-key: ${{ secrets.INFINISPAN_MAVEN_GPG_ARMORED }}
          gpg-passphrase: ${{ secrets.INFINISPAN_MAVEN_GPG_PASSPHRASE }}
          token: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          clobber: "true"

  images:
    needs: [published, release]
    if: startsWith(needs.release.outputs.version, '16.')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release_image.yml
    secrets: inherit
    with:
      branch: ${{ inputs.branch }}
      version: ${{ needs.release.outputs.version }}
      type: ${{ inputs.type }}

  images-legacy:
    needs: [published, release]
    if: startsWith(needs.release.outputs.version, '15.') || startsWith(needs.release.outputs.version, '14.') || startsWith(needs.release.outputs.version, '13.')
    uses: infinispan/infinispan-images/.github/workflows/release.yml@fbfc22d69cec42331c552279d14502bc7032a009 # main
    secrets: inherit
    with:
      branch: main
      ispnVersion: ${{ needs.release.outputs.version }}
      repository: infinispan/infinispan-images
      type: ${{ inputs.type }}

  operator-main:
    needs: [images, release]
    if: ${{ !contains(needs.release.outputs.version, '.Dev') }}
    uses: infinispan/infinispan-operator/.github/workflows/add_operand.yml@ad7722776de21dd4d01ce7d1648079f28a1b98d2 # main
    secrets: inherit
    with:
      image: quay.io/infinispan/server:${{ needs.release.outputs.version }}
      ref: main
      repository: infinispan/infinispan-operator


  cli-packages:
    needs: [sign-cli-assets, release]
    if: needs.sign-cli-assets.result == 'success'
    uses: ./.github/workflows/release_cli_packages.yml
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}

  update-website:
    needs: [published, sign-cli-assets, sign-server-dist, release]
    if: always() && needs.published.result == 'success' && needs.sign-cli-assets.result == 'success' && needs.sign-server-dist.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update website release data
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.API_TOKEN_GITHUB }}
          repository: infinispan/infinispan.github.io
          event-type: release_updated
          client-payload: '{"project": "infinispan", "version": "${{ needs.release.outputs.version }}"}'

  update-org-vars:
    needs: [published, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app-token
        with:
            client-id: ${{ secrets.GH_APP_ISPN_ID }}
            private-key: ${{ secrets.GH_APP_ISPN_KEY }}

      - name: Update GitHub Organization Variable to next release version
        if: ${{ !contains(needs.release.outputs.version, '.Dev') }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh variable set "RELEASE_$(echo '${{ needs.release.outputs.version }}' | cut -f 1-2 -d '.' | tr . _)_VERSION" -b "$(echo ${{ needs.release.outputs.nextVersion }} | cut -f 1 -d '-')" --org infinispan --visibility all;

      - name: Update RELEASE variable to the next main branch version if current release version matches
        if: ${{ needs.release.outputs.version == vars.RELEASE }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh variable set RELEASE -b "$(echo ${{ needs.release.outputs.nextVersion }} | cut -f 1 -d '-')" --org infinispan  --visibility all;
          gh variable set "RELEASE_$(echo '${{ needs.release.outputs.version }}' | cut -f 1-2 -d '.' | tr . _)_VERSION" -b "$(echo '${{ needs.release.outputs.version }}' | cut -f 1-2 -d '.').1" --org infinispan --visibility all;

  # Best effort: keeps the example artifact version in KEYS on main current after a latest release.
  # Runs only once Maven Central publication is confirmed, and never blocks or fails the release itself.
  update-signing-statement:
    needs: [published, release]
    if: ${{ inputs.type == 'latest' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      # Serialize with the equivalent job of the resume workflow and with other release runs,
      # so that concurrent KEYS updates cannot conflict on main. Note that a pending update
      # can still be displaced by a later dispatch (GitHub keeps only one pending run per
      # group); this is accepted because the update is best-effort and the next latest
      # release heals it. Once actionlint learns the concurrency "queue" property
      # (github.blog/changelog/2026-05-07), setting queue: max here removes the limitation.
      group: update-signing-statement
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Update example artifact version in KEYS
        uses: ./.github/actions/update-signing-statement
        with:
          release-version: ${{ needs.release.outputs.version }}
          token: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
