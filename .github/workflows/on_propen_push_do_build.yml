name: Build
on:
  pull_request:
  push:
    branches:
      - feature/*
      - main
      - '*.x'

permissions:
  contents: read

concurrency:
  # Cancel jobs same head_branch same repo, works
  # both for pull_request and push
  group: >
      ${{ github.workflow }}-${{ github.repository }}-
      ${{ github.event.pull_request.head.ref || github.event.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      build-type: ${{ steps.check.outputs.build-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Determine build type
        id: check
        uses: ./.github/actions/detect-changes

      - name: Record build type
        env:
          BUILD_TYPE: ${{ steps.check.outputs.build-type }}
        run: printf '%s' "$BUILD_TYPE" > build-type.txt

      - name: Upload build type
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-type
          path: build-type.txt

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.build-type == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Build Infinispan
        uses: ./.github/actions/build-infinispan

      - name: Server version
        run: |
          # shellcheck disable=SC2016
          mvn -q -Dexec.executable=echo -Dexec.args='-n ${project.version}' --non-recursive exec:exec > server-version.txt

      - name: Archive server version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-version
          path: |
            server-version.txt

  build-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.build-type == 'docs-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Build Documentation
        run: ./mvnw install -B -pl documentation -am -DskipTests -Pdistribution

