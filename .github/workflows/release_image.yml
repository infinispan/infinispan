name: Release Images

on:
  workflow_call:
    inputs:
      version:
        description: 'Infinispan Server version'
        required: true
        type: string
      branch:
        description: 'The repository branch to checkout'
        required: true
        type: string
      type:
        description: 'The type of release (latest, prerelease)'
        required: true
        type: string
      push:
        description: 'Push to remote repositories'
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: 'Infinispan Server version'
        required: true
        type: string
      branch:
        description: 'The repository branch to checkout'
        default: main
        type: string
      type:
        description: The type of release
        required: true
        default: default
        type: choice
        options:
          - default
          - latest
          - prerelease
      push:
        description: 'Push to remote repositories'
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}

      -  name: Generate Image Tags
         run: echo "IMAGE_TAGS=$(./.github/scripts/image_tags.sh)" >> "$GITHUB_ENV"
         env:
           VERSION: ${{ inputs.version }}
           TYPE: ${{ inputs.type }}

      - name: Log in to Docker Hub
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io

      - name: Log in to Quay.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
          registry: quay.io

      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with:
          build-args: |
            BRAND_VERSION=${{ inputs.version }}
            BRAND_NAME=Infinispan
            JDK_DIST=src/main/docker/adoptium
            SERVER_DIST=https://github.com/infinispan/infinispan/releases/download/${{ inputs.version }}/infinispan-server-${{ inputs.version }}.zip
          containerfiles: ./server/image/src/main/docker/Dockerfile
          context: ./server/image
          image: server
          platforms: linux/amd64, linux/arm64
          tags: ${{ env.IMAGE_TAGS }}

      - name: Push to Docker Hub
        id: push-to-docker
        if: ${{ inputs.push }}
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
        with:
          registry: docker.io/infinispan
          image: server
          tags: ${{ steps.build-image.outputs.tags }}

      - name: Print Docker Hub image url
        run: echo "Image pushed to ${{ steps.push-to-docker.outputs.registry-paths }}"

      - name: Push to Quay.io
        id: push-to-quay
        if: ${{ inputs.push }}
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
        with:
          registry: quay.io/infinispan
          image: server
          tags: ${{ steps.build-image.outputs.tags }}

      - name: Print Quay.io image url
        run: echo "Image pushed to ${{ steps.push-to-quay.outputs.registry-paths }}"

      - name: Install cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Prepare registry credentials for SBOM attestation
        if: ${{ inputs.push }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          cp "$HOME/.config/containers/auth.json" "$RUNNER_TEMP/docker-config/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Generate SBOM
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: docker.io/infinispan/server:${{ inputs.version }}
          format: spdx-json
          output-file: ./sbom.spdx.json
          syft-version: 'v1.52.0'
          upload-artifact: false
          upload-release-assets: false

      - name: Create SBOM attestations for all tags
        if: ${{ inputs.push }}
        run: |
          set -euo pipefail
          cosign attest --predicate ./sbom.spdx.json --type spdxjson "docker.io/infinispan/server:${{ inputs.version }}"
          cosign attest --predicate ./sbom.spdx.json --type spdxjson "quay.io/infinispan/server:${{ inputs.version }}"