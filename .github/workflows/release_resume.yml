name: Resume Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The Infinispan branch to checkout when cutting the release."
        required: true
        default: "main"
      version:
        description: "Release version"
        required: true
      type:
        type: choice
        description: The type of release
        required: true
        default: "default"
        options:
          - default
          - latest
          - prerelease

permissions:
  contents: read

# Serialize with the release workflow and with other resumes: overlapping runs (a
# release and its resume, or two resumes) must not interleave one run's asset with
# another run's signature. The group is shared with release.yml and deliberately
# version-less: releases are never cut concurrently, and a version-less key also
# serializes a release dispatched without an explicit version with its own resume.
# GitHub keeps only one pending run per group, so a newer dispatch displaces a pending
# one instead of queueing behind it; that is accepted because releases are dispatched
# one at a time, and a displaced dispatch can simply be re-run, whereas interleaved
# uploads would corrupt the release. Once actionlint learns the concurrency "queue"
# property (github.blog/changelog/2026-05-07), setting queue: max here removes the
# limitation.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  published:
    runs-on: ubuntu-latest
    steps:
      - uses: GOSCHEN/http-status-code@944938ed534b092b9f7e1e5c6b08c5d9bbc35162 # v1.1.0
        with:
          url: https://repo1.maven.org/maven2/org/infinispan/infinispan-distribution/${{ inputs.version }}/infinispan-distribution-${{ inputs.version }}.pom
          code: 200
          timeout: 10800000
          interval: 1200

  native-cli:
    needs: published
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-2022, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            asset_name: linux-x86_64
            gu_binary: gu
          - os: macos-latest
            asset_name: osx-aarch_64
            gu_binary: gu
          - os: macos-15-intel
            asset_name: osx-x86_64
            gu_binary: gu
          - os: windows-2022
            asset_name: windows-x86_64
            gu_binary: gu.cmd
          - os: ubuntu-24.04-arm
            asset_name: linux-aarch_64
            gu_binary: gu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1
        with:
          version: '25.0'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Detect CLI module path
        id: detect-cli
        shell: bash
        run: |
          if [ -f graalvm/cli/pom.xml ]; then
            echo "module=graalvm/cli" >> $GITHUB_OUTPUT
          else
            echo "module=quarkus/cli" >> $GITHUB_OUTPUT
          fi

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Build native executable
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86_amd64
          mvnw.cmd package -Pdistribution -Pwindows -Pnative -am -pl ${{ steps.detect-cli.outputs.module }}
        shell: cmd

      - if: ${{ matrix.os != 'windows-2022' }}
        name: Build native executable
        run: ./mvnw package -Pdistribution -Pnative -am -pl ${{ steps.detect-cli.outputs.module }}

      # The built archive is passed to the sign-cli-assets job, which signs and attaches it.
      # Keeping the credentials out of this job means tag-controlled build code never executes
      # on a runner that holds the GPG key, passphrase or release token.
      - name: Upload CLI native executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infinispan-cli-${{ matrix.asset_name }}
          path: ${{ steps.detect-cli.outputs.module }}/target/infinispan-cli-${{ github.event.inputs.version }}-${{ matrix.asset_name }}.zip
          if-no-files-found: error
          # Re-running the job after an artifact of this name was already uploaded
          # would otherwise fail on the duplicate name.
          overwrite: true

  # Signs and attaches the CLI native executables built by native-cli. This is a separate job
  # that does not check out the release tag, for two reasons:
  # - the signing credentials never run on a runner that executed tag-controlled build code;
  # - the signing action is always loaded from the workflow's own revision, so it is available
  #   even for the tags of older releases that predate it.
  sign-cli-assets:
    needs: native-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # The workflow-level concurrency group serializes this resume with the release
      # workflow, so by the time this job runs the release already exists. Validate the
      # dispatch input and the release once, and fail fast on a bad dispatch instead of
      # uploading into a nonexistent release.
      - name: Validate the release
        env:
          GH_TOKEN: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          # Indirected so the dispatch input reaches this script as data, never as shell
          # syntax; the regex below rejects anything that is not a release version.
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(\.[A-Za-z][A-Za-z0-9]*)?(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          if ! gh release view "$VERSION" --json tagName >/dev/null 2>&1; then
            echo "::error::Release $VERSION does not exist, nothing to resume"
            exit 1
          fi

      - name: Download CLI native executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: cli-assets
          pattern: infinispan-cli-*

      - name: Sign and attach CLI native executables
        uses: ./.github/actions/sign-release-assets
        with:
          release-tag: ${{ inputs.version }}
          asset-paths: cli-assets/*/*.zip
          gpg-armored-key: ${{ secrets.INFINISPAN_MAVEN_GPG_ARMORED }}
          gpg-passphrase: ${{ secrets.INFINISPAN_MAVEN_GPG_PASSPHRASE }}
          token: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          clobber: "true"

  # Best effort: repairs a partially uploaded server distribution, e.g. when the original
  # release run was interrupted between uploading the ZIP and its .asc signature, or when a
  # partially replaced upload left the ZIP paired with a signature over different bytes.
  # Re-signs the exact bytes already attached to the release, so no rebuild is needed; when
  # the ZIP itself is missing it is recovered from the run artifact the release workflow
  # stages before attaching. Skipped when the published pair is present and verifies.
  server-dist:
    needs: published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # The workflow-level concurrency group serializes this resume with the release
      # workflow, so the release and whatever assets it managed to attach are in their
      # final state by the time this job runs: a missing server ZIP is recovered by the
      # check step below from the artifact staged before attaching, not waited for.
      # Validate the dispatch input and the release once, and fail fast on a bad dispatch.
      - name: Validate the release
        env:
          GH_TOKEN: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          # Indirected so the dispatch input reaches this script as data, never as shell
          # syntax; the regex below rejects anything that is not a release version.
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(\.[A-Za-z][A-Za-z0-9]*)?(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          if ! gh release view "$VERSION" --json assets >/dev/null 2>&1; then
            echo "::error::Release $VERSION does not exist, nothing to resume"
            exit 1
          fi

      - name: Check server distribution assets
        id: server-dist
        env:
          GH_TOKEN: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          GPG_ARMORED_KEY: ${{ secrets.INFINISPAN_MAVEN_GPG_ARMORED }}
          # Indirected so the dispatch input reaches this script as data, never as shell
          # syntax; the regex below rejects anything that is not a release version.
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(\.[A-Za-z][A-Za-z0-9]*)?(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          zip="infinispan-server-$VERSION.zip"
          names=$(gh release view "$VERSION" --json assets --jq '.assets[].name')
          # Fetch the published bytes: needed to verify the signature below, and by the
          # repair path, which re-signs the asset exactly as published.
          mkdir -p server-dist
          mode=missing-zip
          if grep -Fxq "$zip" <<<"$names"; then
            gh release download "$VERSION" --pattern "$zip" --dir server-dist
            mode=missing-asc
            if grep -Fxq "$zip.asc" <<<"$names"; then
              # Both assets exist, but a partially replaced upload can pair an asset with a
              # signature over different bytes, so verify the pair instead of trusting names.
              gh release download "$VERSION" --pattern "$zip.asc" --dir server-dist
              echo "$GPG_ARMORED_KEY" | gpg --batch --import >/dev/null 2>&1
              if gpg --batch --verify "server-dist/$zip.asc" "server-dist/$zip" >/dev/null 2>&1; then
                mode=complete
              else
                echo "::warning::$zip.asc does not verify against the published $zip; re-signing the pair"
              fi
            fi
          fi
          if [ "$mode" != "complete" ]; then
            # The pair is incomplete, invalid, or the ZIP is missing entirely. The release
            # workflow stages the ZIP as a version-named run artifact after creating the
            # GitHub release and before attaching it. Because `gh release create` fails on
            # an existing release, only the run that created this release ever reaches the
            # staging step for this version; a later dispatch of the release workflow for
            # the same version dies at release creation, before staging. Combined with the
            # workflow filter below, the newest matching artifact is therefore the one
            # staged by the run that created this release.
            #
            # Artifact names are filtered server-side; provenance is then verified per
            # candidate, newest first, against the stable workflow ID of the release
            # workflow (the run's `path` formatting is not stable across API surfaces), so
            # a same-named artifact from any other workflow cannot be signed as a release
            # binary. A candidate whose run cannot be queried is skipped rather than
            # trusted.
            release_workflow_id=$(gh api "repos/infinispan/infinispan/actions/workflows/release.yml" --jq '.id')
            candidates=$(gh api "repos/infinispan/infinispan/actions/artifacts?name=infinispan-server-dist-$VERSION&per_page=100" --paginate \
              --jq ".artifacts[] | select(.expired == false) | [.id, .workflow_run.id, .created_at] | @tsv" \
              | sort -k3,3 -r)
            artifact_id=""
            while IFS=$'\t' read -r aid run_id _; do
              [ -n "$aid" ] || continue
              if run_workflow_id=$(gh api "repos/infinispan/infinispan/actions/runs/$run_id" --jq '.workflow_id' 2>/dev/null); then
                if [ "$run_workflow_id" = "$release_workflow_id" ]; then
                  artifact_id="$aid"
                  break
                fi
              fi
            done <<< "$candidates"
            staged_zip=""
            if [ -n "$artifact_id" ]; then
              mkdir -p staged
              gh api "repos/infinispan/infinispan/actions/artifacts/$artifact_id/zip" > staged/artifact.zip
              unzip -o staged/artifact.zip -d staged
              rm -f staged/artifact.zip
              if [ -f "staged/$zip" ]; then staged_zip="staged/$zip"; fi
            fi
            if [ "$mode" = "missing-zip" ]; then
              if [ -n "$staged_zip" ]; then
                # Delete any signature left on the release first, so an interruption
                # between the two uploads cannot pair it with the recovered ZIP; the
                # re-sign step below (or the next resume) attaches a matching one.
                if grep -Fxq "$zip.asc" <<<"$names"; then
                  gh release delete-asset "$VERSION" "$zip.asc" --yes
                fi
                cp "$staged_zip" "server-dist/$zip"
                echo "Recovered $zip from staged artifact $artifact_id; attaching it to release $VERSION"
                gh release upload --clobber "$VERSION" "server-dist/$zip"
                mode=missing-asc
              fi
            elif [ -z "$staged_zip" ]; then
              # The published ZIP's signature is missing or invalid and no staged
              # artifact is available to confirm which bytes the release build
              # produced: signing them would endorse content the project cannot
              # verify it built. Refuse.
              echo "::error::$zip on release $VERSION has a missing or invalid signature and no staged infinispan-server-dist-$VERSION artifact is available to verify its bytes; refusing to re-sign it. Re-run the sign-server-dist job of the original release run (while its build artifact is still available) or rebuild the release."
              exit 1
            elif ! cmp -s "server-dist/$zip" "$staged_zip"; then
              # The published ZIP is about to be re-signed: it must be the bytes the
              # release build staged, otherwise this workflow would put the project's
              # signature on content the project never built.
              echo "::error::$zip on release $VERSION does not match the bytes staged by the release workflow (artifact $artifact_id); refusing to re-sign it"
              exit 1
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Fail when the server distribution is missing
        if: steps.server-dist.outputs.mode == 'missing-zip'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "::error::The server distribution ZIP is not attached to release $VERSION and no staged infinispan-server-dist-$VERSION artifact was found (the release run may have died before staging, or the artifact has expired). Re-run the sign-server-dist job of the original release run (while its build artifact is still available) or attach the ZIP manually."
          exit 1

      # Only the signature is attached: the ZIP's bytes were verified against (or
      # recovered from) the staged build artifact, so they are identical to the published
      # ones and re-uploading them (gh --clobber deletes the existing asset before
      # uploading the replacement) would risk deleting the published asset for no benefit.
      - name: Re-sign and re-attach server distribution
        if: steps.server-dist.outputs.mode == 'missing-asc'
        uses: ./.github/actions/sign-release-assets
        with:
          release-tag: ${{ inputs.version }}
          asset-paths: server-dist/*.zip
          upload-signatures-only: "true"
          gpg-armored-key: ${{ secrets.INFINISPAN_MAVEN_GPG_ARMORED }}
          gpg-passphrase: ${{ secrets.INFINISPAN_MAVEN_GPG_PASSPHRASE }}
          token: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
          clobber: "true"

  images:
    needs: published
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release_image.yml
    secrets: inherit
    with:
      branch: ${{ inputs.branch }}
      version: ${{ inputs.version }}
      type: ${{ inputs.type }}

  operator:
    needs: images
    if: contains(github.event.inputs.version, '.Final')
    uses: infinispan/infinispan-operator/.github/workflows/add_operand.yml@ad7722776de21dd4d01ce7d1648079f28a1b98d2 # main
    secrets: inherit
    with:
      # The dispatch input, not github.ref_name: this workflow is dispatched from a
      # branch, so the ref name is not the release version.
      image: quay.io/infinispan/server:${{ inputs.version }}
      ref: main
      repository: infinispan/infinispan-operator

  update-website:
    needs: [published, sign-cli-assets, server-dist]
    if: always() && needs.published.result == 'success' && needs.sign-cli-assets.result == 'success' && needs.server-dist.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update website release data
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.API_TOKEN_GITHUB }}
          repository: infinispan/infinispan.github.io
          event-type: release_updated
          client-payload: '{"project": "infinispan", "version": "${{ inputs.version }}"}'

  update-org-vars:
    needs: published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app-token
        with:
            client-id: ${{ secrets.GH_APP_ISPN_ID }}
            private-key: ${{ secrets.GH_APP_ISPN_KEY }}

      - name: Update GitHub Organization Variable to next release version
        if: ${{ !contains(inputs.version, '.Dev') }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Indirected so the dispatch input reaches this script as data, never as shell
          # syntax; the regex below rejects anything that is not a release version.
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(\.[A-Za-z][A-Za-z0-9]*)?(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          gh variable set "RELEASE_$(echo "$VERSION" | cut -f 1-2 -d '.' | tr . _)_VERSION" -b "$(echo "$VERSION" | cut -f 1 -d '-')" --org infinispan --visibility all;

  # Best effort: keeps the example artifact version in KEYS on main current after a latest
  # release, including one completed through this resume workflow. Never blocks or fails
  # the resume itself.
  update-signing-statement:
    needs: published
    if: ${{ inputs.type == 'latest' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      # Serialize with the equivalent job of the release workflow and with other resume
      # runs, so that concurrent KEYS updates cannot conflict on main. Note that a pending
      # update can still be displaced by a later dispatch (GitHub keeps only one pending
      # run per group); this is accepted because the update is best-effort and the next
      # latest release heals it. Once actionlint learns the concurrency "queue" property
      # (github.blog/changelog/2026-05-07), setting queue: max here removes the limitation.
      group: update-signing-statement
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Update example artifact version in KEYS
        uses: ./.github/actions/update-signing-statement
        with:
          release-version: ${{ inputs.version }}
          token: ${{ secrets.INFINISPAN_RELEASE_TOKEN }}
