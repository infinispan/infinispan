name: Update Signing Statement
description: Best-effort update of the example artifact version in main's KEYS file after a latest release

inputs:
  release-version:
    description: "The released version the KEYS example should reference"
    required: true
  token:
    description: "Token with push access to main (secret)"
    required: true

runs:
  using: composite
  steps:
    - name: Checkout main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        ref: main
        token: ${{ inputs.token }}

    - name: Update example artifact version in KEYS
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.release-version }}
      run: |
        set -euo pipefail
        # The version ends up in KEYS content and in a commit message: reject anything
        # that is not a release version before it gets near sed.
        if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){2}(\.[A-Za-z][A-Za-z0-9]*)?(-[A-Za-z0-9._-]+)?$ ]]; then
          echo "::error::Invalid release version: $RELEASE_VERSION"
          exit 1
        fi
        git config user.name 'Infinispan Release'
        git config user.email 'infinispan-maven@infinispan.org'
        # Refresh before deciding, so the checks below run against the current state of
        # main rather than the checkout snapshot: a concurrent update that already pushed
        # must be visible here, or the final rebase would conflict and leave the example
        # stale.
        git pull --rebase origin main
        # Match the complete example version, including any qualifier such as .Final, by
        # anchoring on the .pom extension used in every KEYS example.
        old=$(grep -oE 'infinispan-bom-[0-9]+(\.[0-9]+){0,2}(\.[A-Za-z][A-Za-z0-9]*)?\.pom' KEYS | head -1 | sed -e 's/^infinispan-bom-//' -e 's/\.pom$//') || true
        if [ -z "$old" ]; then echo "::warning::No example version found in KEYS; skipping"; exit 0; fi
        if [ "$old" = "$RELEASE_VERSION" ]; then echo "KEYS already references $RELEASE_VERSION; nothing to do"; exit 0; fi
        # A latest release that finishes late must not overwrite a newer example.
        if [ "$(printf '%s\n' "$old" "$RELEASE_VERSION" | sort -V | tail -1)" != "$RELEASE_VERSION" ]; then
          echo "KEYS references newer example $old; not overwriting it with $RELEASE_VERSION"
          exit 0
        fi
        sed -i "s/infinispan-bom-$old/infinispan-bom-$RELEASE_VERSION/g" KEYS
        git add KEYS
        git commit -m "[#18429] Update signing statement example to $RELEASE_VERSION"
        # main may have moved since the refresh above; rebase so we never clobber
        # concurrent changes.
        git pull --rebase origin main
        git push origin HEAD:main
